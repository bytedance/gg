name: Go Test and Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.18.x, 1.19.x, 1.20.x, 1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.27.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod tidy

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      # Benchmarks run on the latest version only: it is the fastest tool chain
      # and, since Go 1.27, it is also the only one that compiles the generic
      # method variants (the files guarded by "//go:build go1.27").
      - name: Run benchmarks
        if: matrix.go-version == '1.27.x'
        run: go test -v -bench=. -benchmem ./...

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          files: coverage.txt
          flags: go-${{ matrix.go-version }},unittests
          name: go-${{ matrix.go-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
